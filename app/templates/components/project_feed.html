{% macro project_feed(feed_events) %}

<div class="card project-feed-card shadow-sm">

    <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title mb-0">
            <i class="fas fa-bolt mr-2"></i>
            Actividad reciente
        </h3>

        <span class="badge badge-light">
            Live
        </span>
    </div>

    <div class="card-body project-feed">

        {% if feed_events %}

            <div id="project-feed-list">
                {% for item in feed_events %}

                    <div class="feed-item" data-feed-id="{{ item.id_feed }}">
                        <div class="feed-icon {{ get_feed_color(item.event_type) }}">
                            <i class="fas {{ get_feed_icon(item.event_type) }}"></i>
                        </div>

                        <div class="feed-content">
                            <div class="feed-message">
                                {{ item.message | safe }}
                            </div>

                            <div class="feed-date">
                                <i class="far fa-clock mr-1"></i>
                                {{ item.created_at.strftime("%d/%m/%Y %H:%M") }}
                            </div>
                        </div>
                    </div>

                {% endfor %}
            </div>

        {% else %}

            <div id="project-feed-list">
                <div class="text-muted small project-feed-empty">
                    <i class="fas fa-info-circle mr-1"></i>
                    Todavía no hay actividad reciente en este proyecto.
                </div>
            </div>

        {% endif %}

    </div>

</div>

{% endmacro %}
